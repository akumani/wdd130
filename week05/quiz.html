<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Test your knowledge of HTML and CSS with this short quiz.">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
    <header>
        <h1>Basic HTML and CSS Quiz</h1>
    </header>
    <main>
        <form>
            <div class="form-item">
                <label for="q1"><strong>1.</strong> What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>

            <div class="form-item">
                <label for="q2"><strong>2.</strong> How are id and class attributes selected in CSS?</label>
                <textarea id="q2" name="q2" rows="4"></textarea>
            </div>

            <div class="form-item">
                <label for="q3"><strong>3.</strong> Which of the following is a valid CSS comment?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="css-comment">/* This is a comment */</option>
                    <option value="html-comment">&lt;!-- This is a comment --&gt;</option>
                    <option value="js-comment">// This is a comment</option>
                </select>
            </div>

            <div class="form-item">
                <label for="q4"><strong>4.</strong> In a three-value CSS margin declaration, what does the third value set?</label>
                <input type="number" id="q4" name="q4" step="1">
            </div>

            <button type="submit">Submit Quiz</button>
        </form>
        <footer>
            <p>&copy; 2026 Akumani Edem <span aria-hidden="true">|</span> WDD 130 &middot; HTML and CSS Quiz</p>
        </footer>
    </main>
</body>
</html>
